<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modular Desk Organizer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* The modular builder. Same visual language as the classic viewer (src/template.html): a full-bleed stage beside
   a slim instrument panel, right sidebar on wide screens, bottom sheet on phones. The stage shows either the 3D
   view (canvas) or the plan editor (svg). */
:root {
  --stage: #E6EAE4;      /* studio backdrop, faint sage */
  --stage-hi: #F3F5F1;
  --stage-lo: #D5DBD3;
  --panel: #F6F7F4;
  --ink: #1B2420;
  --muted: #5E6A64;
  --line: #CDD5CE;
  --accent: #2C6A56;     /* moss: active controls, selection */
  --accent-soft: #DDE9E3;
  --accent-ink: #FFFFFF;
  --chip: rgba(246, 247, 244, 0.9);
  --ok: #2F7A4E;
  --warn: #B4581A;
  --warn-soft: #F6E6DA;
  --err: #B3362B;        /* overlaps: the one thing that stops a download */
  --err-soft: #F8E2DE;
  --err-ink: #FFFFFF;
  --mod: #DCE5DE;        /* a module on the plan */
  --mod-line: #6F857A;
  --grid: rgba(27, 36, 32, 0.07);
  --grid-hi: rgba(27, 36, 32, 0.13);
  --shadow-alpha: 0.2;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-ui: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "DM Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #151A18; --stage-hi: #1E2522; --stage-lo: #0D110F;
    --panel: #19201D; --ink: #E4EAE6; --muted: #98A39D; --line: #2D3632;
    --accent: #7BC6AC; --accent-soft: #23342D; --accent-ink: #0E1613;
    --chip: rgba(25, 32, 29, 0.88); --ok: #6FCB95; --warn: #E8A063; --warn-soft: #3A2A1E;
    --err: #F08B7D; --err-soft: #42231F; --err-ink: #1D0C09;
    --mod: #26312C; --mod-line: #6E8178; --grid: rgba(228, 234, 230, 0.06); --grid-hi: rgba(228, 234, 230, 0.12);
    --shadow-alpha: 0.5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #151A18; --stage-hi: #1E2522; --stage-lo: #0D110F;
  --panel: #19201D; --ink: #E4EAE6; --muted: #98A39D; --line: #2D3632;
  --accent: #7BC6AC; --accent-soft: #23342D; --accent-ink: #0E1613;
  --chip: rgba(25, 32, 29, 0.88); --ok: #6FCB95; --warn: #E8A063; --warn-soft: #3A2A1E;
  --err: #F08B7D; --err-soft: #42231F; --err-ink: #1D0C09;
  --mod: #26312C; --mod-line: #6E8178; --grid: rgba(228, 234, 230, 0.06); --grid-hi: rgba(228, 234, 230, 0.12);
  --shadow-alpha: 0.5;
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--stage); color: var(--ink);
  font: 400 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:disabled { cursor: default; opacity: 0.5; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.ic { width: 20px; height: 20px; display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 356px; position: relative; }

/* ---------- stage ---------- */
.stage {
  position: relative; min-width: 0; min-height: 0; overflow: hidden;
  background: radial-gradient(120% 95% at 50% 36%, var(--stage-hi) 0%, var(--stage) 52%, var(--stage-lo) 100%);
}
#c, .plan { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; -webkit-user-select: none; user-select: none; }
.app[data-view="plan"] #c, .app[data-view="plan"] .labels, .app[data-view="plan"] .veil, .app[data-view="plan"] .only3d { display: none; }
.app[data-view="3d"] .plan { display: none; }
.app.short .tools .only3d, .app.short .labels, .app.short .hint { display: none; }
.plan { cursor: grab; }
.plan.moving { cursor: grabbing; }
.plan:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }

.hud {
  position: absolute; top: calc(var(--safe-t) + 12px); left: max(16px, var(--safe-l)); right: calc(max(16px, var(--safe-r)) + 124px);
  pointer-events: none; display: grid; gap: 3px; justify-items: start;
}
.hud > * { pointer-events: auto; }
.title {
  width: 100%; margin: -3px 0 -2px -6px; padding: 2px 6px; border: 1px solid transparent; border-radius: 7px; background: transparent;
  font: 700 23px/1.1 var(--font-display); letter-spacing: -0.015em; text-overflow: ellipsis; min-width: 0;
}
.title:hover { border-color: var(--line); }
.title:focus { border-color: var(--accent); background: var(--chip); outline: none; }
.meta { font: 400 12px/1.3 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
.fit {
  margin-top: 5px; display: inline-flex; align-items: center; gap: 7px; max-width: calc(100% + 60px); min-height: 32px; position: relative;
  padding: 4px 11px 4px 9px; border-radius: 999px; border: 1px solid var(--line); text-align: left;
  background: var(--chip); font: 500 12px/1.2 var(--font-ui); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.fit::after { content: ""; position: absolute; inset: -5px -4px; }      /* a 42 px target for thumbs */
.fit i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.fit.warn i { background: var(--warn); }
.fit.err { border-color: var(--err); background: var(--err); color: var(--err-ink); }
.fit.err i { background: var(--err-ink); }
.fit.idle i { background: var(--muted); }

.warns { display: grid; gap: 4px; justify-items: start; margin-top: 4px; width: calc(100% + 60px); max-height: 38vh; overflow-y: auto; pointer-events: none; }
.warns > * { pointer-events: auto; }
.wrow {
  display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 7px; align-items: start; max-width: 100%; min-height: 40px; text-align: left;
  padding: 6px 10px 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--chip);
  font: 400 12px/1.3 var(--font-ui); color: var(--ink); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.wrow svg.ic { width: 16px; height: 16px; color: var(--muted); margin-top: -0.5px; }
.wrow.warn { border-color: var(--warn); background: var(--warn-soft); }
.wrow.warn svg.ic { color: var(--warn); }
.wrow.error { border-color: var(--err); background: var(--err); color: var(--err-ink); font-weight: 600; box-shadow: 0 4px 14px rgba(179, 54, 43, 0.28); }
.wrow.error svg.ic { color: var(--err-ink); }
.wfix { margin-left: 23px; padding: 6px 14px; min-height: 40px; border-radius: 8px; border: 1px solid var(--err); background: var(--chip); color: var(--err); font: 600 12px/1.2 var(--font-ui); }
.wmore { padding: 5px 12px; min-height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); font: 500 12px/1.2 var(--font-ui); color: var(--muted); }

.views {
  position: absolute; top: calc(var(--safe-t) + 12px); right: max(12px, var(--safe-r));
  display: flex; gap: 3px; padding: 3px; border-radius: 11px;
  background: var(--chip); border: 1px solid var(--line); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.views button {
  border: 0; background: transparent; border-radius: 8px; padding: 0 13px; min-width: 52px; min-height: 40px;
  font: 600 13px/1 var(--font-ui); color: var(--muted);
}
.views button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tools { position: absolute; top: calc(var(--safe-t) + 68px); right: max(12px, var(--safe-r)); display: grid; gap: 6px; }
.undo { position: absolute; left: max(12px, var(--safe-l)); bottom: 12px; display: flex; gap: 6px; }
.tool {
  width: 42px; height: 42px; display: grid; place-items: center; padding: 0; border-radius: 11px;
  border: 1px solid var(--line); background: var(--chip); color: var(--ink); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.tool[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tool:disabled { opacity: 0.38; }

.hint {
  position: absolute; left: calc(max(12px, var(--safe-l)) + 102px); right: 96px; bottom: 25px; margin: 0;
  font: 400 12px/1.3 var(--font-ui); color: var(--muted); pointer-events: none; transition: opacity .6s;
}
.hint.gone { opacity: 0; }
.busy {
  position: absolute; right: max(14px, var(--safe-r)); bottom: 25px; margin: 0;
  font: 500 12px/1.3 var(--font-mono); color: var(--muted); opacity: 0; transition: opacity .2s; pointer-events: none;
}
.busy.on { opacity: 1; }
.toast {
  position: absolute; left: 50%; bottom: 64px; transform: translate(-50%, 8px); max-width: min(86%, 420px); margin: 0;
  padding: 8px 13px; border-radius: 10px; background: var(--ink); color: var(--panel); font: 500 12.5px/1.35 var(--font-ui); text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis;
  padding: 3px 8px 4px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--chip); color: var(--ink); font: 600 12px/1.2 var(--font-ui);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); will-change: transform;
}
.tag.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tag.flag { background: var(--warn-soft); border-color: var(--warn); color: var(--ink); }
.tag.bad { background: var(--err); border-color: var(--err); color: var(--err-ink); }

.veil { position: absolute; inset: 0; display: grid; place-items: center; padding: 96px 28px 72px; text-align: center; pointer-events: none; }
.veil-box { display: grid; gap: 12px; justify-items: center; max-width: 340px; pointer-events: auto; }
.veil p { margin: 0; font: 400 13.5px/1.5 var(--font-ui); color: var(--muted); text-wrap: balance; }
.veil p b { display: block; margin-bottom: 4px; font: 600 15px/1.3 var(--font-ui); color: var(--ink); }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }

/* ---------- the plan (svg) ---------- */
.pl-grid { fill: none; stroke: var(--grid); stroke-width: 1; }
.pl-grid.hi { stroke: var(--grid-hi); }
.pl-plate { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 5 5; opacity: 0.55; }
.pl-note { font: 400 10.5px/1 var(--font-mono); fill: var(--muted); }
.pl-mod { fill: var(--mod); stroke: var(--mod-line); stroke-width: 1.4; stroke-linejoin: round; }
.pl-mod.flag { stroke: var(--warn); stroke-width: 2; }
.pl-mod.bad { stroke: var(--err); stroke-width: 2.2; }
.pl-mod.sel { stroke: var(--accent); stroke-width: 2.6; }
.pl-mod.drag { fill-opacity: 0.86; }
.pl-mod.invalid { stroke: var(--err); stroke-width: 2.4; stroke-dasharray: 6 4; }
.pl-front { fill: none; stroke: var(--mod-line); stroke-width: 3; stroke-linecap: round; opacity: 0.8; }
.pl-arrow { fill: var(--mod-line); opacity: 0.85; }
.pl-name { font: 600 12px/1 var(--font-ui); fill: var(--ink); text-anchor: middle; }
.pl-size { font: 400 10.5px/1 var(--font-mono); fill: var(--muted); text-anchor: middle; }
.pl-tab { fill: var(--ink); opacity: 0.62; }
.pl-glue { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1 6; opacity: 0.55; fill: none; }
.pl-nojoint { stroke: var(--warn); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 5; fill: none; }
.pl-blocked { stroke: var(--warn); stroke-width: 4; stroke-linecap: round; fill: none; }
.pl-overlap { fill: var(--err); fill-opacity: 0.28; stroke: var(--err); stroke-width: 1.5; }
.pl-hatch { stroke: var(--err); stroke-width: 1.4; }
.pl-ghost { fill: var(--accent); fill-opacity: 0.1; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; }
.pl-guide { stroke: var(--accent); stroke-width: 1; opacity: 0.9; }
.pl-handle { fill: var(--panel); stroke: var(--accent); stroke-width: 2; }
.pl-handle.on { fill: var(--accent); }
.pl-dim { font: 500 11px/1 var(--font-mono); fill: var(--accent-ink); text-anchor: middle; }
.pl-dimbox { fill: var(--accent); }
.pl-empty { font: 500 13px/1 var(--font-ui); fill: var(--muted); text-anchor: middle; }

/* ---------- panel ---------- */
.panel { min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); }
.grab { display: none; }
.tabs {
  flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 11px; border: 1px solid var(--line);
  margin: calc(var(--safe-t) + 12px) max(18px, var(--safe-r)) 0 18px;
}
.tab {
  border: 0; background: transparent; border-radius: 8px; padding: 0 2px; min-height: 40px;
  font: 600 13px/1.15 var(--font-ui); color: var(--muted); white-space: nowrap;
}
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.tabpanel { display: grid; gap: 18px; padding: 16px max(18px, var(--safe-r)) calc(var(--safe-b) + 28px) 18px; align-content: start; }
.sec { display: grid; gap: 10px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-width: 0; }
.sec h2, .sec h3 { margin: 0; font: 600 11px/1.2 var(--font-ui); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.sec-head span { font: 500 12.5px/1.2 var(--font-ui); color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lead { margin: 0; font: 400 13px/1.45 var(--font-ui); color: var(--muted); }

.slider { display: grid; gap: 1px; min-width: 0; }
.slider label, .field-label { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font: 500 13px/1.2 var(--font-ui); }
.slider output, .field-label output { font: 400 12.5px/1.2 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 6px; align-items: center; }
.step {
  width: 40px; height: 40px; padding: 0; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); background: transparent;
  font: 400 17px/1 var(--font-mono); color: var(--muted);
}
.step:active { background: var(--accent-soft); color: var(--ink); }
input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); height: 40px; touch-action: pan-y; background: transparent; }
.help { margin: 0; font: 400 12px/1.4 var(--font-ui); color: var(--muted); }
.field { display: grid; gap: 6px; min-width: 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; padding: 3px; border-radius: 10px; border: 1px solid var(--line); }
.seg button {
  border: 0; background: transparent; border-radius: 7px; padding: 0 4px; min-height: 40px;
  font: 500 12.5px/1.15 var(--font-ui); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
.switch {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; width: 100%; min-height: 40px; padding: 2px 0;
  border: 0; background: transparent; text-align: left; font: 500 13px/1.25 var(--font-ui);
}
.switch small { grid-column: 1; font: 400 12px/1.4 var(--font-ui); color: var(--muted); }
.switch i { grid-column: 2; grid-row: 1 / span 2; width: 42px; height: 26px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; }
.switch i::after {
  content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--panel); box-shadow: 0 1px 2.5px rgba(0, 0, 0, 0.3); transition: transform .15s;
}
.switch[aria-checked="true"] i { background: var(--accent); }
.switch[aria-checked="true"] i::after { transform: translateX(16px); }
.info {
  margin: 0; padding: 9px 11px; border-radius: 8px; background: var(--stage);
  font: 400 12.5px/1.45 var(--font-ui); color: var(--muted);
}
.info.warn { background: var(--warn-soft); color: var(--ink); }
.info.err { background: var(--err-soft); color: var(--ink); }

.btn {
  border-radius: 10px; padding: 0 14px; min-height: 40px; font: 600 13.5px/1.15 var(--font-ui);
  border: 1px solid var(--line); background: transparent; white-space: nowrap;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 12.5px; border-color: var(--accent); color: var(--accent); }
.btn.danger { background: var(--err); border-color: var(--err); color: var(--err-ink); }
.status { margin: 0; font: 400 12px/1.4 var(--font-ui); color: var(--muted); min-height: 1.4em; }
.status.warn { color: var(--warn); }
.status.err { color: var(--err); font-weight: 500; }

/* module tab */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.card {
  display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 1px 9px; align-items: start; align-content: center; text-align: left;
  min-height: 60px; padding: 8px 9px; border-radius: 11px; border: 1px solid var(--line); background: transparent;
}
.card:active { background: var(--accent-soft); border-color: var(--accent); }
.card svg { grid-row: 1 / span 2; align-self: center; width: 26px; height: 26px; color: var(--accent); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.card b { font: 600 13px/1.2 var(--font-ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card small { font: 400 11.5px/1.25 var(--font-ui); color: var(--muted); }
.card.tpl { grid-template-columns: 44px minmax(0, 1fr); }
.card.tpl svg { width: 44px; height: 36px; stroke-width: 1.2; }
.card.tpl svg rect { fill: var(--mod); stroke: var(--mod-line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 40px; padding: 0 13px 0 11px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; font: 500 12.5px/1.2 var(--font-ui);
}
.chipbtn i { width: 9px; height: 9px; border-radius: 3px; background: var(--mod-line); flex: none; }
.chipbtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mhead { display: grid; grid-template-columns: 30px minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.mhead > svg { width: 28px; height: 28px; color: var(--accent); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.text {
  width: 100%; min-width: 0; height: 40px; padding: 0 11px; border-radius: 10px; border: 1px solid var(--line); background: transparent;
  font: 600 15px/1.2 var(--font-ui);
}
.text:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 1px var(--accent); }
.iconbtn { width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
.acts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.act {
  display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 54px; padding: 6px 2px; border-radius: 11px;
  border: 1px solid var(--line); background: transparent; font: 500 11.5px/1.15 var(--font-ui); white-space: nowrap;
}
.act:active { background: var(--accent-soft); }
.act.del { color: var(--err); }
.nudge { display: grid; grid-template-columns: repeat(4, 44px) minmax(0, 1fr); gap: 6px; align-items: center; }
.nudge .iconbtn { width: 44px; color: var(--ink); }
.nudge output { justify-self: end; font: 400 12px/1.3 var(--font-mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.backrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.backrow b { font: 600 14px/1.25 var(--font-ui); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* style tab */
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 40px; height: 40px; border-radius: 50%; padding: 0; background: transparent; border: 0; display: grid; place-items: center;
}
.swatch i { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); box-shadow: inset 0 -3px 6px rgba(0, 0, 0, 0.12); }
.swatch[aria-pressed="true"] i { outline: 2px solid var(--accent); outline-offset: 2px; }

/* print tab */
.printers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.printer {
  display: grid; gap: 2px; text-align: left; min-height: 48px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent;
}
.printer b { font: 600 12.5px/1.2 var(--font-ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.printer small { font: 400 11.5px/1.2 var(--font-mono); color: var(--muted); }
.printer[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.parts { display: grid; gap: 5px; margin: 0; padding: 0; list-style: none; }
.part {
  display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 1px 9px; align-items: center; width: 100%; min-height: 46px; padding: 6px 10px;
  border-radius: 10px; border: 1px solid var(--line); background: transparent; text-align: left;
}
.part i { grid-row: 1 / span 2; width: 10px; height: 10px; border-radius: 3px; background: var(--mod-line); }
.part b { font: 600 13px/1.2 var(--font-ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.part small { grid-column: 2; font: 400 11.5px/1.2 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.part em { grid-column: 3; grid-row: 1 / span 2; font: 500 12px/1.2 var(--font-ui); font-style: normal; color: var(--ok); white-space: nowrap; }
.part.warn em { color: var(--warn); }
.part.warn { border-color: var(--warn); }
.part[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.area {
  width: 100%; min-height: 84px; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--stage); resize: vertical;
  font: 400 12px/1.45 var(--font-mono); color: var(--ink);
}
.area:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 1px var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filebtn { position: relative; display: inline-grid; place-items: center; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.export {
  position: sticky; bottom: 0; z-index: 2; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center;
  margin: 0 -18px calc(-1 * (var(--safe-b) + 28px)); padding: 12px 18px calc(var(--safe-b) + 14px);
  background: var(--panel); border-top: 1px solid var(--line);
}
.export .status { grid-column: 1 / -1; }
.foot { margin: 0; font: 400 12px/1.45 var(--font-ui); color: var(--muted); }

/* ---------- in-page dialog ---------- */
.scrim { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; background: rgba(13, 17, 15, 0.42); }
.dialog {
  width: min(100%, 360px); display: grid; gap: 10px; padding: 20px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
}
.dialog h2 { margin: 0; font: 700 18px/1.2 var(--font-display); letter-spacing: -0.01em; }
.dialog p { margin: 0; font: 400 13.5px/1.5 var(--font-ui); color: var(--muted); }
.dlg-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }

/* ---------- phones: bottom sheet ---------- */
@media (max-width: 760px) {
  .hint { display: none; }      /* the sheet right below opens with the same sentence; here it ran across the model */
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .panel {
    border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; margin-top: -14px; position: relative; z-index: 3;
    height: 46vh; height: 46dvh; max-height: calc(100vh - 150px); max-height: calc(100dvh - 150px); box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.07);
  }
  .app[data-sheet="max"] .panel { height: 76vh; height: 76dvh; }
  .app[data-sheet="min"] .panel { height: calc(84px + var(--safe-b)); }
  .app[data-sheet="min"] .scroll { visibility: hidden; }
  .panel.dragging { transition: none; }
  .grab { display: grid; place-items: center; flex: none; width: 100%; height: 30px; margin-bottom: -4px; padding: 0; border: 0; background: transparent; touch-action: none; cursor: ns-resize; }
  .grab i { width: 40px; height: 4px; border-radius: 2px; background: var(--line); }
  .tabs { margin: 0 max(14px, var(--safe-r)) 0 max(14px, var(--safe-l)); }
  .tabpanel { gap: 16px; padding: 14px max(14px, var(--safe-r)) calc(var(--safe-b) + 22px) max(14px, var(--safe-l)); }
  .export { margin: 0 -14px calc(-1 * (var(--safe-b) + 22px)); padding: 10px 14px calc(var(--safe-b) + 12px); }
  .hud { right: calc(max(12px, var(--safe-r)) + 118px); left: max(14px, var(--safe-l)); }
  .title { font-size: 20px; }
  .undo { bottom: 26px; }
  .hint, .busy { bottom: 39px; }
  .toast { bottom: 80px; }
  .veil { padding-bottom: 96px; }
}
@media (min-width: 761px) {
  .tabs { margin-top: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .hint, .busy, .toast, .switch i, .switch i::after { transition: none; }
  .pulse { animation: none; opacity: 0.8; }
}

<body>
<div class="app" id="app" data-view="3d" data-sheet="mid">
  <section class="stage" id="stage" aria-label="The organizer">
    <canvas id="c" aria-label="3D view of the organizer. Drag to rotate, tap a module to select it."></canvas>
    <svg class="plan" id="plan" role="application" tabindex="0" aria-label="Plan of the organizer, seen from above with the front at the bottom. Drag a module to move it, drag the handles of the selected module to resize it."></svg>
    <div class="labels" id="labels" aria-hidden="true"></div>
    <div class="veil" id="veil">
      <div class="veil-box" role="status">
        <i class="pulse" id="veilDot"></i>
        <p id="veilText">Starting the geometry engine…</p>
        <button class="btn small" id="veilBtn" type="button" hidden>Open the plan</button>
      </div>
    </div>
    <header class="hud" id="hud">
      <input class="title" id="dName" type="text" maxlength="60" value="Modular Desk Organizer" aria-label="Name of this design" autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done">
      <div class="meta" id="meta">&nbsp;</div>
      <button class="fit idle" id="fitChip" type="button" aria-label="Print check. Opens the Print tab."><i></i><span id="fitText">Checking the print plate…</span></button>
      <div class="warns" id="warns" role="region" aria-label="Things to check"></div>
    </header>
    <div class="views" role="group" aria-label="View">
      <button id="view3d" type="button" aria-pressed="true">3D</button>
      <button id="viewPlan" type="button" aria-pressed="false">Plan</button>
    </div>
    <div class="tools" role="toolbar" aria-label="View options" aria-orientation="vertical">
      <button class="tool only3d" id="tExplode" type="button" aria-pressed="false" aria-label="Show the parts apart" title="Show the parts apart"></button>
      <button class="tool only3d" id="tDrawers" type="button" aria-pressed="false" aria-label="Pull the drawers open" title="Pull the drawers open" hidden></button>
      <button class="tool only3d" id="tLabels" type="button" aria-pressed="true" aria-label="Show labels" title="Labels"></button>
      <button class="tool" id="tFit" type="button" aria-label="Fit everything in view" title="Fit in view"></button>
    </div>
    <div class="undo" role="group" aria-label="History">
      <button class="tool" id="bUndo" type="button" aria-label="Undo" title="Undo" disabled></button>
      <button class="tool" id="bRedo" type="button" aria-label="Redo" title="Redo" disabled></button>
    </div>
    <p class="hint" id="hint">Tap a module to edit it, or add one</p>
    <p class="busy" id="busy" aria-hidden="true">Rebuilding…</p>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
  </section>

  <aside class="panel" id="panel" aria-label="Design controls">
    <button class="grab" id="grab" type="button" aria-label="Make the panel smaller or bigger" aria-expanded="true"><i></i></button>
    <div class="tabs" role="tablist" aria-label="Controls">
      <button class="tab" role="tab" id="tab-module" aria-controls="tp-module" aria-selected="true" type="button">Module</button>
      <button class="tab" role="tab" id="tab-style" aria-controls="tp-style" aria-selected="false" tabindex="-1" type="button">Style</button>
      <button class="tab" role="tab" id="tab-print" aria-controls="tp-print" aria-selected="false" tabindex="-1" type="button">Print</button>
    </div>
    <div class="scroll" id="scroll">
      <div class="tabpanel" id="tp-module" role="tabpanel" aria-labelledby="tab-module"><p class="lead">Loading the catalog…</p></div>
      <div class="tabpanel" id="tp-style" role="tabpanel" aria-labelledby="tab-style" hidden></div>
      <div class="tabpanel" id="tp-print" role="tabpanel" aria-labelledby="tab-print" hidden></div>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle" aria-describedby="dlgText">
      <h2 id="dlgTitle"></h2>
      <p id="dlgText"></p>
      <div class="dlg-actions">
        <button class="btn" id="dlgCancel" type="button">Cancel</button>
        <button class="btn primary" id="dlgOk" type="button">OK</button>
      </div>
    </div>
  </div>
</div>

    var IC = {
      undo: '<path d="M7 5 3.5 8.5 7 12"/><path d="M4 8.5h7.5a4.25 4.25 0 0 1 0 8.5H8"/>',
      redo: '<path d="M13 5l3.5 3.5L13 12"/><path d="M16 8.5H8.5a4.25 4.25 0 0 0 0 8.5H12"/>',
      explode: '<rect x="2.5" y="2.5" width="6" height="6" rx="1.2"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.2"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.2"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.2"/>',

      rotate: '<path d="M16 10.2a6 6 0 1 1-1.9-4.5"/><path d="M14.6 2.4v3.6H11"/>',

    var TYPE_IC = {
      bin: '<path d="M5 6.5v10.3a2.2 2.2 0 0 0 2.2 2.2h9.6a2.2 2.2 0 0 0 2.2-2.2V6.5"/><path d="M3.2 6.5h3.4M17.4 6.5h3.4"/>',
      block: '<rect x="4" y="10" width="16" height="9.5" rx="1.8"/><path d="M8 10V5.5M12 10V4M16 10V6.5"/>',

    if (saved && saved.ui && typeof saved.ui === 'object') Object.keys(ui).forEach(function (k) { if (typeof saved.ui[k] === typeof ui[k]) ui[k] = saved.ui[k]; });
    if (['module', 'style', 'print'].indexOf(ui.tab) < 0) ui.tab = 'module';
    if (ui.view !== 'plan') ui.view = '3d';

    function edited() { return JSON.stringify(hist.present) !== baseline; }
    function filament() { return FILAMENTS.filter(function (f) { return f.id === ui.color; })[0] || FILAMENTS[0]; }

    /* ---------- edits and history ---------- */
    function designChanged() {

      flagged = flagged.filter(function (id) { return analysis.byId[id]; });
      touchBuild();
      syncAll();
      persist();
    }
    function setHistory(next) {

    function seal() { hist = E.history.seal(hist); }
    var REASONS = { limit: 'That is as far as this module goes.', missing: 'That module is gone.' };
    function apply(r, key) {            // r: a result from the editor

    }
    function undo() { if (!E.history.canUndo(hist)) return; setHistory(E.history.undo(hist)); toast('Undone'); }
    function redo() { if (!E.history.canRedo(hist)) return; setHistory(E.history.redo(hist)); toast('Redone'); }

        if (!moved) { setSheet(ui.sheet === 'min' ? 'mid' : ui.sheet === 'mid' ? 'max' : 'mid'); return; }
        var snaps = [['min', 84], ['mid', vh * 0.46], ['max', vh * 0.76]], best = snaps[1];
        snaps.forEach(function (s) { if (Math.abs(s[1] - hgt) < Math.abs(best[1] - hgt)) best = s; });
        setSheet(best[0]);
      }
      g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
      g.addEventListener('click', function (e) { if (e.detail === 0) setSheet(ui.sheet === 'max' ? 'mid' : 'max'); });   // keyboard
    })();
    var dlgOk = null, dlgReturn = null;
    function ask(title, text, okLabel, onOk) {
      dlgOk = onOk; dlgReturn = document.activeElement;
      $('dlgTitle').textContent = title; $('dlgText').textContent = text; $('dlgOk').textContent = okLabel || 'OK';
      $('scrim').hidden = false; $('dlgCancel').focus();
    }
    function closeDialog(ok) {
      var fn = dlgOk; dlgOk = null; $('scrim').hidden = true;
      try { if (dlgReturn && dlgReturn.focus) dlgReturn.focus(); } catch (e) {}
      if (ok && fn) fn();
    }
    $('dlgOk').addEventListener('click', function () { closeDialog(true); });
    $('dlgCancel').addEventListener('click', function () { closeDialog(false); });
    $('scrim').addEventListener('click', function (e) { if (e.target === $('scrim')) closeDialog(false); });
    $('scrim').addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { e.preventDefault(); closeDialog(false); }
      else if (e.key === 'Tab') { var a = $('dlgCancel'), b = $('dlgOk'); if (document.activeElement === (e.shiftKey ? a : b)) { e.preventDefault(); (e.shiftKey ? b : a).focus(); } }
    });

    /* ---------- keyboard ---------- */
    document.addEventListener('keydown', function (e) {
      if (!$('scrim').hidden) return;
      var t = e.target, mod = e.metaKey || e.ctrlKey, k = e.key;
      if (isTextField(t)) { if (k === 'Escape' && t !== printUI.area) t.blur(); return; }
      if (mod && !e.altKey && (k === 'z' || k === 'Z')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
      if (mod && !e.altKey && (k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
      if (mod || e.altKey) return;
      var onRange = t && t.tagName === 'INPUT' && t.type === 'range', onTab = t && t.getAttribute && t.getAttribute('role') === 'tab';
      if (k === 'Escape') { if (adding) { adding = false; syncModuleTab(); } else if (sel) select(null); return; }
      if (!sel) return;
      if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); deleteSelected(); return; }
      if (k.indexOf('Arrow') === 0) {
        if (onRange || onTab) return;
        e.preventDefault();
        var dx = k === 'ArrowLeft' ? -1 : k === 'ArrowRight' ? 1 : 0, dy = k === 'ArrowUp' ? 1 : k === 'ArrowDown' ? -1 : 0, n = e.shiftKey ? 5 : 1;
        apply(E.nudge(design(), sel, dx * n, dy * n));
        return;
      }
      if (k === 'r' || k === 'R') { e.preventDefault(); apply(E.rotate(design(), sel, e.shiftKey ? -1 : 1)); return; }
      if (k === 'd' || k === 'D') { e.preventDefault(); var r = apply(E.duplicate(design(), sel)); if (r.ok) select(r.id); }
    });

    /* ---------- frame loop, resizing, theme ---------- */
    var lastT = performance.now(), busyOn = false;
    function loop(now) {
      requestAnimationFrame(loop);
      var dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
      var want = kstate === 'ready' && needBuild;
      if (want !== busyOn) { busyOn = want; $('busy').classList.toggle('on', want); }
      if (want && now >= buildAt && !(gesture && (gesture.type === 'move' || gesture.type === 'resize'))) runBuild();
      tick3D(now, dt);
      tickPlan(now);
    }
    function onResize() {
      app.classList.toggle('short', stage.clientHeight < 340);
      resize3D();
      if (plan.auto && !gesture) planFit(true);
      planDirty = true; warnSig = ''; syncHUD();
    }
    if (window.ResizeObserver) { var ro = new ResizeObserver(onResize); ro.observe(stage); ro.observe($('hud')); }
    else window.addEventListener('resize', onResize);
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      if (mq.addEventListener) mq.addEventListener('change', applyTheme); else if (mq.addListener) mq.addListener(applyTheme);
    }
    new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    window.addEventListener('pagehide', saveNow);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveNow(); });

    /* ---------- hooks for the test scripts in scripts/dev (read-only views, plus select) ---------- */
    window.__builder = {
      get ready() { return ready && !needBuild && !draft; },
      design: function () { return C.clone(hist.present); },
      select: function (id) { select(id, { tab: true }); },
      snapshot: function () {
        var A = cur();
        return { sel: sel, flagged: flagged.slice(), adding: adding, view: ui.view, tab: ui.tab, sheet: ui.sheet, kernel: kstate, stub: !!(kernel && kernel.stub),
          gl: !!G, noGL: noGL, builds: builds, canUndo: E.history.canUndo(hist), canRedo: E.history.canRedo(hist), explode: ui.explode, drawers: ui.drawers,
          labels: ui.labels, colorEach: ui.colorEach, color: ui.color, dlMode: dlMode, edited: edited(), needBuild: needBuild, draft: !!draft,
          warnings: currentWarnings(), modules: A.modules.map(function (m) { return { id: m.id, name: m.name, type: m.type, x: m.x, y: m.y, w: m.w, d: m.d, h: m.h, rot: m.rot, params: m.params, warnings: m.warnings }; }),
          parts: result ? result.parts.map(function (p) { var pv = G && G.views[p.id]; return { id: p.id, moduleId: p.moduleId, role: p.role, key: p.key, cur: pv && pv.cur, tgt: pv && pv.tgt, slide: p.slide }; }) : [],
          geo: G ? { made: G.geoMade, kept: G.geoKept, views: Object.keys(G.views).length, tagsShown: G.tags.filter(function (t) { return !t.el.hidden; }).length } : null,
          plan: { k: plan.k, cx: plan.cx, cy: plan.cy, auto: plan.auto }, lastBuildMs: lastBuildMs };
      },
      pickAt: function (x, y) { return pick3D(x, y); },
      planRect: function (id) {     // the module's rectangle on screen in the plan, in client pixels
        var M = cur().byId[id], r = planEl.getBoundingClientRect();
        if (!M) return null;
        var a = toScreen(M.x, M.y), b = toScreen(M.x + M.w, M.y + M.d);
        return { x0: r.left + a[0], x1: r.left + b[0], y0: r.top + b[1], y1: r.top + a[1], cx: r.left + (a[0] + b[0]) / 2, cy: r.top + (a[1] + b[1]) / 2, k: plan.k };
      },
      screenOf: function (id) {     // a point on the module's top in the 3D view, in client pixels
        if (!G || !result) return null;
        var body = bodyPart(id), pv = body && G.views[body.id];
        if (!pv) return null;
        var bb = body.bbox, v = new THREE.Vector3((bb.min[0] + bb.max[0]) / 2, bb.min[1] + (bb.max[1] - bb.min[1]) * 0.3, bb.max[2] * 0.5 + 0.5);
        v.x += pv.cur[0]; v.y += pv.cur[1]; v.z += pv.cur[2];
        G.world.updateMatrixWorld(true); G.world.localToWorld(v); v.project(G.camera);
        var r = canvas.getBoundingClientRect();
        return { x: r.left + (v.x * 0.5 + 0.5) * r.width, y: r.top + (-v.y * 0.5 + 0.5) * r.height, picked: pick3D(r.left + (v.x * 0.5 + 0.5) * r.width, r.top + (-v.y * 0.5 + 0.5) * r.height) };
      }
    };

    /* ---------- start ---------- */
    init3D();
    setSheet(ui.sheet);
    setTab(ui.tab);
    setView(ui.view);
    syncAll(); syncVeil();
    resize3D();
    planFit(true);
    applyTheme();
    loadKernel();
    requestAnimationFrame(loop);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
